/* ============================================================================
   ストア（§6.3）
   ========================================================================= */
/* 同じアイテムを取ると枠を消費せずレベルが上がる。効果はレベル回数ぶん重なる。 */
function giveItem(it){
  if(!it) return 0;
  // once: 取得した瞬間に効果だけ出して枠には入らない
  if(it.once){
    if(it.onGet) it.onGet(1);
    return 0;
  }
  const own = S.items.find(x => x.id === it.id);
  let lvl;
  if(own){
    own.level = Math.min(CONFIG.itemMaxLv, LV(own) + 1);
    lvl = own.level;
  } else {
    const copy = {...it, level:1};
    if(it.expire) copy.turnsLeft = it.expire;      // 期限つきアイテム
    S.items.push(copy);
    lvl = 1;
  }
  if(own && own.expire) own.turnsLeft = own.expire;  // 重ねると期限も回復する
  if(it.onGet) it.onGet(lvl);      // 取得した瞬間に働く効果
  return lvl;
}

/* rareOnly: true にすると、レア以上だけを候補にして引き直す（種を多めに払う代わり）。
   レアが足りない場合は、残りをコモンで埋める。 */
function rollStore(rareOnly){
  const c = ctx(), n = c.storeSize, pool = [];
  for(const it of ITEMS){
    if(it.once) continue;     // 枠を取らない即発アイテムはコインと交換する専用ショップへ移動した
    if(it.unique && S.items.some(x => x.id === it.id)) continue;
    if(S.items.some(x => x.id === it.id && LV(x) >= CONFIG.itemMaxLv)) continue;
    if(it.need && !S.fruitIds.includes(it.need)) continue;
    // にせものは種類数に上限がある。すでに上限まで持っているなら、
    // 新しい種類は候補に出さない（重ねてレベルを上げるのは可）。
    if(it.fake && !S.items.some(x => x.id === it.id)){
      const kinds = new Set(S.items.filter(x => x.fake).map(x => x.fake));
      if(kinds.size >= CONFIG.fakeMaxKinds) continue;
    }
    pool.push(it);
  }
  if(rareOnly){
    const rares = pool.filter(isRare);
    if(rares.length >= n){
      const out = [];
      const rest = rares.slice();
      while(out.length < n && rest.length) out.push(...rest.splice(rnd(rest.length), 1));
      S.store = out;
      return;
    }
    // レアが足りないときは、あるだけ出してコモンで補う
    const out = rares.slice();
    const commons = pool.filter(x => !isRare(x));
    while(out.length < n && commons.length) out.push(...commons.splice(rnd(commons.length), 1));
    S.store = out;
    return;
  }
  // レアリティで重み付けして引く（CONFIG.rarityWeight の比率どおりに出す）。
  // 各レアリティの「種類数」がそのまま出現率になってしまわないよう、
  // 1枚あたりの重みを「目標比率 ÷ そのレアリティの残り種類数」で決める。
  // こうすると、レアの種類が何種あっても全体の比率は 2:1 に保たれる。
  const out = [];
  while(out.length < n && pool.length){
    const count = {};
    for(const it of pool){ const r = rarityOf(it); count[r] = (count[r] || 0) + 1; }
    const wOf = it => CONFIG.rarityWeight[rarityOf(it)] / count[rarityOf(it)];
    let total = 0;
    for(const it of pool) total += wOf(it);
    let r = Math.random() * total, pick = pool.length - 1;
    for(let i = 0; i < pool.length; i++){
      r -= wOf(pool[i]);
      if(r <= 0){ pick = i; break; }
    }
    out.push(pool[pick]); pool.splice(pick, 1);
  }
  S.store = out;
}

function openStore(after){
  S.busy = false;
  S.afterStore = after || null;
  rollStore();
  renderStore();
}

/* ストアを閉じる。ラウンド開始時のストアだけは閉じたあとの処理が違う。 */
async function finishStore(){
  closeSheet();
  hud();
  const f = S.afterStore;
  S.afterStore = null;
  S.busy = true;
  await refreshFruitSet();       // フルーツ種類が変わるものを取得した場合、その場で盤面へ反映する
  S.busy = false;
  hud();
  // 盤面への反映で連鎖が起きて目標に届くことがあるため、ここでもクリアを判定する。
  // これが無いと、達成済みなのに次のターンへ進んでしまう。
  if(bnCompare(S.harvest, S.target) >= 0){ await stageClear(); return; }
  if(f) f(); else turnReady();
}

function renderStore(discardMode){
  const c = ctx();
  const maxSlots = Math.min(CONFIG.maxSlots, S.slots + c.slotAdd);
  const full = S.items.length >= maxSlots;
  const roundStart = !!S.afterStore;

  const cards = S.store.map((it,i) => {
    const own = S.items.find(x => x.id === it.id);
    const maxed = own && LV(own) >= CONFIG.itemMaxLv;
    const price = priceOf(it);
    const poor = S.coins < price;                 // コインが足りないと買えない
    const off = maxed || poor;
    return `<button class="card ${it.neg?'neg':''} ${own?'on':''}" data-buy="${i}" ${off?'disabled style="opacity:.4"':''}>
       <span class="ic">${it.ic}</span>
       <span style="flex:1"><span class="t">${it.n}
         ${isRare(it) ? (r => `<span class="tag" style="border-color:${r.col};color:${r.col};font-weight:800">${r.mark}${r.n}</span>`)(RARITY[rarityOf(it)]) : ''}
         <span class="tag">${it.tag}</span>
         ${own ? `<span class="tag" style="border-color:var(--lantern);color:var(--lantern)">${
           maxed ? `Lv${LV(own)} 上限` : `Lv${LV(own)} → Lv${LV(own)+1}`}</span>` : ''}</span>
       <div class="d">${descOf(it)}${own && !maxed ? (n => `<br><b style="color:var(--lantern)">重ねると Lv${LV(own)+1} へ（枠は消費しない）${n ? '：' + n : ''}</b>`)(levelUpNote(own)) : ''}</div></span>
       <span class="price" style="color:${poor ? 'var(--bad)' : 'var(--lantern)'}">🪙${price}</span>
     </button>`;
  }).join('');

  const dropList = S.items.map((it,i) =>
    `<button class="card ${it.neg?'neg':''}" data-drop="${i}">
       <span class="ic">${it.ic}</span>
       <span style="flex:1"><span class="t">${it.n}${LV(it) > 1 ? ` Lv${LV(it)}` : ''}</span>
         <div class="d">${descOf(it)}</div></span>
       <span class="price" style="color:var(--lantern)">+🪙${sellPriceOf(it)}</span>
     </button>`).join('');

  // 現在のビルドを、リロール画面から離れずに確認できる一覧
  // ストアからでもその場で売れるようにする（枠を空けて別のものを買える）
  const ownList = S.items.length
    ? S.items.map((it,i) => `<button class="ownrow ${it.neg?'neg':''}" data-sell="${i}"
        style="width:100%;text-align:left;cursor:pointer">
        <span class="ic">${it.ic}</span>
        <span class="t">${it.n}${LV(it) > 1 ? ` Lv${LV(it)}` : ''}</span>
        <span class="d">${descOf(it)}</span>
        <span class="lv" style="color:var(--lantern)">売 +🪙${sellPriceOf(it)}</span>
      </button>`).join('')
    : `<div class="ownrow"><span class="d" style="color:var(--dim)">まだアイテムを持っていません</span></div>`;

  const treList = S.treasures.length
    ? S.treasures.map(t => `<div class="ownrow tre">
        <span class="ic">${t.ic}</span><span class="t">${t.n}</span><span class="d">${descOf(t)}</span>
        ${LV(t) > 1 ? `<span class="lv">Lv${LV(t)}</span>` : ''}
      </div>`).join('')
    : '';

  const rerollCost = () => CONFIG.rerollCost + S.storeRerolls;
  const rareCost = () => rerollCost() + CONFIG.rareRerollCost;
  const canReroll = S.coins >= rerollCost();
  const canRare = S.coins >= rareCost();

  sheet(`
    <h2>${roundStart ? 'ラウンド開始' : '種を蒔く'}</h2>
    <div class="sub">${roundStart
      ? `${stageData(S.stage).name}　まずアイテムを1つ選ぶ（種${S.seeds}個で引き直せる）`
      : `${S.turns >= storeLastTurn() ? 'これが最後のアイテム ・ ' : `次の仕入れまで ${CONFIG.storeInterval}ターン ・ `}残り ${S.turnsMax - S.turns} ターン ・ 収穫 ${fmtScore(S.harvest)} / ${fmtScore(S.target)} ・ 倍率 ${fmtMult(staticMult(c))}`}</div>

    ${discardMode ? `<div class="sub" style="color:var(--bad)">アイテム枠が満杯です。売るアイテムを選んでください（売値はコインで戻ります）。</div>${dropList}
      <div class="row"><button class="btn ghost" data-act="cancelDrop">やめる</button></div>`
    : `${cards}

      <div class="seedbar">
        <span class="lbl">🪙 コイン</span>
        <span class="num">×${S.coins}</span>
        <span class="cost">引き直しに ×${rerollCost()}</span>
      </div>
      <div class="row">
        <button class="btn" data-act="reroll" ${canReroll ? '' : 'disabled'}>
          🪙 引き直す（${rerollCost()}）</button>
        <button class="btn ghost" data-act="skip">取らずに次へ（🪙+${CONFIG.skipSeedReward}）</button>
      </div>
      <div class="row">
        <button class="btn" data-act="rareroll" ${canRare ? '' : 'disabled'}
          style="${canRare ? `border-color:${RARITY.rare.col};color:${RARITY.rare.col}` : ''}">
          ${RARITY.rare.mark} レアだけを引き直す（🪙${rareCost()}）</button>
      </div>
      ${full ? '<div class="sub" style="margin-top:8px;color:var(--bad)">枠が満杯です。取得すると手放すアイテムを選びます。</div>' : ''}

      <div class="row"><button class="btn ghost" data-act="instant">🎫 即発アイテムと交換（枠を消費しない）</button></div>

      <h3 class="sec">現在のアイテム（${S.items.length} / ${maxSlots}）</h3>
      <div class="own">${ownList}</div>
      ${treList ? `<h3 class="sec">たからもの</h3><div class="own">${treList}</div>` : ''}

      <div class="row" style="margin-top:12px">
        <button class="btn ghost" data-act="bd">📊 倍率の内訳</button>
        <button class="btn ghost" data-act="cat">📖 図鑑</button>
      </div>`}
  `, el => {
    el.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      const it = S.store[+b.dataset.buy];
      const price = priceOf(it);
      if(S.coins < price){ toast('コインが足りない'); return; }
      const own = S.items.find(x => x.id === it.id);
      if(!own && S.items.length >= maxSlots){ S.pending = it; renderStore(true); return; }
      S.coins -= price;
      const nl = giveItem(it);
      if(own) toast(`${it.n} が Lv${nl} になった`);
      finishStore();
    });
    el.querySelectorAll('[data-drop]').forEach(b => b.onclick = () => {
      const price = priceOf(S.pending);
      const sold = S.items[+b.dataset.drop];
      const gain = sellPriceOf(sold);
      // 売ったぶんのコインを足してから、新しいアイテムの代金を払う
      if(S.coins + gain < price){ toast('コインが足りない'); return; }
      S.items.splice(+b.dataset.drop, 1);
      S.coins += gain;
      S.discarded++;
      S.coins -= price;
      giveItem(S.pending); S.pending = null;
      toast(`${sold.n} を売って 🪙${gain} 得た`);
      finishStore();
    });
    el.querySelectorAll('[data-sell]').forEach(b => b.onclick = () => {
      const it = S.items[+b.dataset.sell];
      if(!it) return;
      const gain = sellPriceOf(it);
      sheet(`
        <h2>${it.ic} ${it.n} を売る</h2>
        <div class="sub">🪙${gain} コインになり、枠が1つ空きます。この操作は取り消せません。</div>
        <div class="row" style="margin-top:12px">
          <button class="btn danger" data-act="y">🪙${gain} で売る</button>
          <button class="btn ghost" data-act="n">やめる</button>
        </div>`,
        e2 => {
          e2.querySelector('[data-act="y"]').onclick = () => {
            const at = S.items.indexOf(it);
            if(at >= 0){
              S.items.splice(at, 1);
              S.coins += gain;
              S.discarded++;
              if(S.items.some(x => x.id === 'compost')){
                const base = FRUITS[0].base + ctx().baseAdd;
                S.compostBonus += Math.max(1, Math.round(base * 0.05 * 10) / 10);
              }
              toast(`${it.n} を売って 🪙${gain} 得た`);
            }
            hud(); renderStore();
          };
          e2.querySelector('[data-act="n"]').onclick = () => renderStore();
        }, () => renderStore());
    });
    const act = el.querySelector('[data-act="reroll"]');
    if(act) act.onclick = () => {
      if(S.coins < rerollCost()) return;
      S.coins -= rerollCost();           // 残数は再描画で即座に反映される
      S.storeRerolls++;                  // 引き直すほど高くなる（ゲーム全体で積み上がる）
      rollStore(); renderStore(); hud();
    };
    const rr = el.querySelector('[data-act="rareroll"]');
    if(rr) rr.onclick = () => {
      if(S.coins < rareCost()) return;
      S.coins -= rareCost();
      S.storeRerolls++;
      rollStore(true);                   // レアだけで引き直す
      renderStore(); hud();
    };
    const sk = el.querySelector('[data-act="skip"]');
    if(sk) sk.onclick = () => {
      S.coins += CONFIG.skipSeedReward;
      toast(`種 +${CONFIG.skipSeedReward}`);
      finishStore();
    };
    const inst = el.querySelector('[data-act="instant"]');
    if(inst) inst.onclick = () => openInstantShop(() => renderStore());
    const cd = el.querySelector('[data-act="cancelDrop"]');
    if(cd) cd.onclick = () => { S.pending = null; renderStore(); };
    const bd = el.querySelector('[data-act="bd"]');
    if(bd) bd.onclick = () => openBreakdown(() => renderStore());
    const cat = el.querySelector('[data-act="cat"]');
    if(cat) cat.onclick = () => openCatalog(() => renderStore());
  });
}

    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="c">戻る</button></div>
  `, el => {
    el.querySelectorAll('[data-buy]').forEach(b => b.onclick = () => {
      if(S.coins < CONFIG.instantItemCost) return;
      const it = instants.find(x => x.id === b.dataset.buy);
      S.coins -= CONFIG.instantItemCost;
      giveItem(it);            // once系はgiveItem内でonGetだけ呼ばれ、枠は消費しない
      hud();
      draw();
    });
    const bb = el.querySelector('[data-act="buybomb"]');
    if(bb) bb.onclick = () => {
      if(S.coins < CONFIG.bombPrice) return;
      S.coins -= CONFIG.bombPrice;
      S.bombs++;
      toast(`爆弾を買った（所持 ${S.bombs}）`);
      hud();
      draw();
    };
    el.querySelector('[data-act="c"]').onclick = done;
  }, done);
  draw();
}

/* ============================================================================
   ステージ進行
   ========================================================================= */
function startStage(skipIntro){
  // 引き直しの値段は挑戦をまたいで上がり続けるが、同じステージをやり直すときは
  // 挑戦前の値段に戻す。失敗するほど引き直しが高くなると、何度も挑む設計と噛み合わないため。
  if(S.rerollStage !== S.stage){
    S.rerollStage = S.stage;
    S.rerollBase = S.storeRerolls;
  } else {
    S.storeRerolls = S.rerollBase;
  }
  autoSave();                      // このステージに入った時点の状態を保存する
  const st = stageData(S.stage);
  S.w = st.w; S.h = st.h;
  S.target = st.target;
  S.turns = 0;
  S.stageCleared = 0;
  S.counters = {};
  S.harvest = 0;
  S.baseMult = S.carriedMult;      // 継承の苗木で持ち越した基本倍率
  S.carriedMult = 1;
  S.harvestBoost = 1;              // 3×3の大収穫で上がる、盤面全体の基礎スコア倍率
  S.discarded = 0;                 // このステージでアイテムを手放した回数
  S.festivalMult = CONFIG.festivalStart;  // 🎊大収穫祭が育てていく倍率
  S.compostBonus = 0;              // 堆肥箱で積み上げた基礎スコア（ステージ内で永続）
  S.items = [];
  const c1 = ctx();                       // アイテムをリセットした状態でたからものを再評価
  S.turnsMax = st.turns + c1.turnAdd;
  S.seeds = CONFIG.roundSeeds + c1.startSeeds;
  S.fruitIds = activeFruitIds();

  // 前のステージから持ち越したアイテム
  S.carryOver.forEach(it => S.items.push(it));
  S.carryOver = [];

  // 騙しアイテムを抱えすぎていると、その分だけ制限ターンを失う
  const cDeceit = ctx().deceit;
  if(cDeceit > CONFIG.deceitTurnLoss){
    const loss = Math.floor((cDeceit - CONFIG.deceitTurnLoss) / CONFIG.deceitTurnLoss) + 1;
    S.turnsMax = Math.max(3, S.turnsMax - loss);
  }
  for(let i=0;i<c1.startItems;i++){ rollStore(); giveItem(pick(S.store)); }

  tileEls.forEach(el => el.remove()); tileEls.clear();
  buildBoard();
  layout(); sync(true); hud();
  S.busy = false; S.sel = null; S.bombMode = false;

  // たからものを選んだ直後は、導入画面を挟まずそのままアイテム選択へ進む
  // （たからもの → アイテムの2画面を続けて見せるため）
  if(skipIntro){
    openStore(() => announce(`あと${S.turnsMax}ターン！`, 'var(--lantern)'));
    return;
  }

  const overseas = S.stage >= STAGES.length;
  sheet(`
    <h2>${st.name}</h2>
    <div class="sub">STAGE ${S.stage+1}${overseas ? ' ／ 国外編' : ''}</div>
    ${overseas && S.stage === STAGES.length ? `<div class="doc" style="margin-bottom:8px;color:var(--candy)">
      ここからは海の向こう。よその国の食糧難を解決していく。</div>` : ''}
    <div class="doc">
      <b>${st.turns + c1.turnAdd}</b> ターン以内に <b>${fmtScore(st.target)}</b> 収穫。<br>
      アイテムが手に入るのは <b>${Math.floor((st.turns + c1.turnAdd) * CONFIG.storePhase)}ターン目まで</b>。
      残りはビルドを回して稼ぐ時間。<br>
      盤面 ${st.w}×${st.h} ／ 登場フルーツ ${S.fruitIds.length}種
      <br>不思議な種 <b>${S.seeds}</b> 個（そのまま爆弾として使える）
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" data-act="map">🗺️ マップ</button>
      <button class="btn primary" data-act="go">農園を開く</button>
    </div>
  `, el => {
    el.querySelector('[data-act="map"]').onclick = () => openMap();
    el.querySelector('[data-act="go"]').onclick = () => {
    // ラウンド開始時のアイテム選択（§1）
    openStore(() => announce(`あと${S.turnsMax}ターン！`, 'var(--lantern)'));
    };
  });
}

async function stageClear(){
  S.busy = true;

  // まず「クリアした」という手応えを見せてから、いつもの選択画面へ進む
  announce('収 穫 達 成 ！', 'var(--lantern)');
  await sleep(T(1900));

  // 本編の最終ステージを越えた瞬間だけ、物語の区切りを挟む
  const finale = S.stage + 1 === STAGES.length;
  if(finale){
    await sleep(T(400));
    announce('国民の食糧難、解決！', 'var(--candy)');
    await sleep(T(2200));
  }

  S.maxStage = Math.max(S.maxStage, S.stage + 1);
  S.slots = Math.min(CONFIG.maxSlots, S.slots + CONFIG.slotGain);

  // 持ち越すアイテムの既定選択：2個以下ならすべて、3個以上ならレベルの高い順に2個。
  // あとから「持ち越すアイテムを選ぶ」画面で変更できる。
  S.carryOver = S.items.length <= carryLimit()
    ? S.items.slice()
    : S.items.slice().sort((a,b) => LV(b) - LV(a)).slice(0, carryLimit());

  // 余ったターンと、持ち越されずに消えるアイテムをポイントに換算する
  // （地力・累計収穫量にも反映されるよう、lifetimeを確定させる前に加算する）
  // 残りターンボーナス：今回の収穫 × 0.1 × 残りターン数（収穫が大きいほど効く）
  const leftoverTurns = Math.max(0, S.turnsMax - S.turns);
  const turnBonus = leftoverTurns > 0
    ? bnMul(S.harvest, CONFIG.turnBonusRatio * leftoverTurns)
    : bn(0);
  const lostItems = S.items.filter(it => !S.carryOver.includes(it));
  const itemBonus = bn(lostItems.reduce((a, it) => a + CONFIG.itemBonusPerLv * LV(it), 0));
  const totalBonus = bnAdd(turnBonus, itemBonus);
  if(bnCompare(totalBonus, 0) !== 0){
    S.harvest = bnAdd(S.harvest, totalBonus);
    const ts = $('turnScore');
    if(ts){
      ts.textContent = '+' + fmtScore(totalBonus);
      ts.style.color = '#FFD86B';
      ts.classList.remove('show'); void ts.offsetHeight; ts.classList.add('show');
    }
    await sleep(T(500));
  }

  // 残った種はコインになる（種はステージをまたがないが、コインは残る）
  const coinGain = S.seeds * CONFIG.coinPerSeed;
  if(coinGain > 0){ S.coins += coinGain; S.seeds = 0; hud(); }

  const soilBefore = soilLevel();
  S.lifetime = bnAdd(S.lifetime, bnCompare(S.harvest, 0) > 0 ? S.harvest : 0);   // 累計収穫量は永続（地力の元）
  const soilAfter = soilLevel();

  // 継承の苗木：基本倍率の上昇分を次のステージへ
  const carryFrac = Math.min(1, ctx().carryMult);
  S.carriedMult = 1 + (S.baseMult - 1) * carryFrac;
  hud();

  // 残った種はここで使い切れる（次のステージ開始時にリセットされる）
  let rerolls = 0;
  const rerollCost = () => CONFIG.treasureReroll + rerolls;
  let offer = [];
  const rollOffer = () => {
    // 通常のたからものは重複して出ることがある（出れば強化のチャンスになる）。
    // ただし noLevel（レベルアップの概念がないもの）は、一度持ったら二度と出ない。
    const pool = TREASURES.filter(t => !(t.noLevel && S.treasures.some(x => x.id === t.id)));
    offer = [];
    while(offer.length < 3 && pool.length) offer.push(...pool.splice(rnd(pool.length), 1));
  };
  rollOffer();

  // クリア後はマップへ戻る。次にどこへ向かうかはマップ上で選ぶ。
  // （skipIntro は以前の直行フロー用の引数。マップ経由になったので使わない）
  const nextStage = () => {
    S.stage++;
    S.carriedMult = S.carriedMult;   // 持ち越しはそのまま保持
    autoSave();                      // マップに戻る時点で保存しておく
    closeSheet();
    openMap();
  };
  // たからものを選んだ直後の遷移。持ち越すアイテムがあるなら、その選択画面を
  // 挟んでから次の農園へ進む（枠を種で増やすのもこの画面で行う）。
  const afterTreasure = () => { if(S.items.length) drawCarry(true); else nextStage(true); };
  const head = `
    <h2>${finale ? '国民の食糧難、解決！' : '収穫達成'}</h2>
    <div class="sub">${stageData(S.stage).name} ／ ${fmtScore(S.harvest)} 収穫</div>
    ${finale ? `<div class="doc" style="margin:8px 0;padding:11px;border-radius:12px;
      background:linear-gradient(180deg,#FFF1D2,#FFE4B0);border:1px solid var(--lantern)">
      国じゅうの倉が実りで満ちた。もう飢える者はいない。<br>
      ——だが、海の向こうにはまだ痩せた土地が広がっている。<br>
      <b>次はよその国の食糧難を、この農園の実りで解決しにいこう。</b>
    </div>` : ''}
    <div class="hud-bot" style="margin:0 0 10px">
      <div class="chip"><small>レベル</small><b>${S.stage + 1}</b></div>
      <div class="chip"><small>クリアターン</small><b>${S.turns} / ${S.turnsMax}</b></div>
    </div>
    <div class="doc">
      ${bnCompare(turnBonus,0)!==0 ? `残り${leftoverTurns}ターンぶんのボーナス（収穫 ×${CONFIG.turnBonusRatio}×${leftoverTurns}） <b style="color:var(--lantern)">+${fmtScore(turnBonus)}</b><br>` : ''}
      ${bnCompare(itemBonus,0)!==0 ? `持ち越されない${lostItems.length}個のアイテムをポイント換算 <b style="color:var(--lantern)">+${fmtScore(itemBonus)}</b><br>` : ''}
      アイテム枠が <b>${Math.min(CONFIG.maxSlots, S.slots)}</b> に増えた。<br>
      ${S.items.length === 0 ? ''
        : S.items.length <= carryLimit()
          ? `アイテムは全て（${S.items.length}個）次の農園へ連れていく。<br>`
          : `アイテムのうち <b>${S.carryOver.length}</b> 個を次の農園へ連れていく（下のボタンで選び直せる）。<br>`}
      ${S.baseMult > 1 ? `基本倍率 <b>×${S.baseMult}</b>${carryFrac > 0
        ? ` → <b style="color:var(--lantern)">×${Math.round(S.carriedMult*100)/100} を持ち越し</b>`
        : '（持ち越しには「継承の苗木」が必要）'}<br>` : ''}
      ${coinGain ? `余った種 <b>${coinGain}</b> 個が <b style="color:var(--lantern)">🪙${coinGain} コイン</b> になった（所持 🪙${S.coins}）<br>` : ''}
      累計収穫量 <b>${fmtScore(S.lifetime)}</b>
      ${soilAfter > soilBefore
        ? `／ <b style="color:var(--lantern)">地力が Lv${soilAfter} に上がった（基礎スコア +${CONFIG.soilGain * soilAfter}）</b>`
        : `／ 地力 Lv${soilAfter}（次は ${fmtScore(soilNext())}）`}
    </div>`;

  const owned = (attr) => S.treasures.map((t,i) => `
    <button class="card tre" data-${attr}="${i}">
      <span class="ic">${t.ic}</span>
      <span style="flex:1"><span class="t">${t.n}
        ${LV(t) > 1 ? `<span class="tag">Lv${LV(t)}</span>` : ''}</span>
        <div class="d">${descOf(t)}</div></span>
    </button>`).join('');

  // ---- 発見したたからものを選ぶ ----
  const draw = () => {
    const body = offer.length
      ? `<h3 class="sec">たからものを発見した</h3>` + offer.map((t,i)=>
          `<button class="card tre" data-tre="${i}">
            <span class="ic">${t.ic}</span>
            <span style="flex:1"><span class="t">${t.n}</span><div class="d">${t.d}</div></span>
          </button>`).join('')
      : `<div class="sub">今回は何も見つからなかった。</div>`;
    const full = S.treasures.length >= CONFIG.treasureSlots;

    sheet(`${head}${body}
      ${full && offer.length ? `<div class="sub" style="margin-top:8px;color:var(--lantern)">
        枠が満杯です。同じたからものなら自動で強化され、違うものなら入れ替えか置いていくかを選べます。</div>` : ''}
      ${offer.length ? `
        <div class="seedbar">
          <span class="lbl">🪙 コイン</span>
          <span class="num">×${S.coins}</span>
          <span class="cost">引き直しに ×${rerollCost()}</span>
        </div>
        <div class="row"><button class="btn" data-act="reroll"
          ${S.coins >= rerollCost() ? '' : 'disabled'}>🪙 たからものを引き直す（${rerollCost()}）</button></div>
        <div class="doc" style="font-size:11px;margin-top:6px;color:var(--dim)">
          引き直すたびに必要なコインが1つ増えます。
        </div>` : ''}
      ${S.treasures.length ? `<h3 class="sec">いま持っているたからもの</h3>
        <div class="own">${S.treasures.map(t => `<div class="ownrow tre">
          <span class="ic">${t.ic}</span><span class="t">${t.n}</span>
          <span class="d">${descOf(t)}</span>
          ${LV(t) > 1 ? `<span class="lv">Lv${LV(t)}</span>` : ''}</div>`).join('')}</div>` : ''}
      ${S.items.length ? `<div class="row" style="margin-top:10px">
        <button class="btn" data-act="carry">🎒 持ち越しアイテムと枠（${S.carryOver.length} / ${carryLimit()}）</button>
      </div>` : ''}
      <div class="row" style="margin-top:10px">
        <button class="btn" data-act="map">🗺️ マップ</button>
        <button class="btn primary" data-act="next">次の農園へ</button>
      </div>
    `, el => {
      el.querySelector('[data-act="map"]').onclick = () => openMap(draw);
      const cr = el.querySelector('[data-act="carry"]');
      if(cr) cr.onclick = () => drawCarry(false);
      const rr = el.querySelector('[data-act="reroll"]');
      if(rr) rr.onclick = () => {
        if(S.coins < rerollCost()) return;
        S.coins -= rerollCost();
        rerolls++;
        rollOffer();
        hud();
        draw();
      };
      el.querySelectorAll('[data-tre]').forEach(b => b.onclick = () => {
        const t = offer[+b.dataset.tre];
        const own = S.treasures.find(x => x.id === t.id);
        if(own){
          // 偶然同じたからものが出た → 自動的に強化する（枠の空き状況に関係ない）
          if(t.noLevel){ toast(`${t.n} はすでに持っている`); draw(); return; }
          const nl = Math.min(CONFIG.treasureMaxLv, LV(own) + 1);
          const maxed = nl === LV(own);
          own.level = nl;
          toast(maxed ? `${t.n} は上限に達している` : `${t.n} が Lv${nl} になった`);
          hud();
          afterTreasure();          // 続けて「持ち越すアイテム」の選択へ
        } else if(S.treasures.length < CONFIG.treasureSlots){
          S.treasures.push({...t, level:1});
          afterTreasure();          // 続けて「持ち越すアイテム」の選択へ
        } else {
          handle(t);   // 新しいたからもの、かつ枠が満杯 → 入れ替えるか捨てるかのみ
        }
      });
      el.querySelector('[data-act="next"]').onclick = () => nextStage(false);
    });
  };

  // ---- 次のステージへ持ち越すアイテムを選ぶ ----
  const drawCarry = (thenNext) => {
    const picked = i => S.carryOver.includes(S.items[i]);
    sheet(`
      <h2>アイテムを持ち越す</h2>
      <div class="sub">最大 ${carryLimit()} 個まで（${S.carryOver.length} / ${carryLimit()}）。
        レベルの高い順に既定で選ばれています。タップで選び直せます。</div>
      ${S.items.map((it,i) => `
        <button class="card ${it.neg?'neg':''} ${picked(i)?'on':''}" data-pick="${i}">
          <span class="ic">${it.ic}</span>
          <span style="flex:1"><span class="t">${it.n}
            ${LV(it) > 1 ? `<span class="tag">Lv${LV(it)}</span>` : ''}
            ${it.turnsLeft !== undefined ? `<span class="tag">残り${it.turnsLeft}ターン</span>` : ''}</span>
            <div class="d">${descOf(it)}</div></span>
          <span class="chk">✓</span>
        </button>`).join('')}
      <div class="seedbar">
        <span class="lbl">🪙 コイン</span>
        <span class="num">×${S.coins}</span>
        <span class="cost">${nextCarryCost() === null
          ? '枠は上限です'
          : `次の枠 ${nextCarryCost()}コイン`}</span>
      </div>
      ${nextCarryCost() !== null ? `<button class="btn" data-act="buy"
        ${S.coins < nextCarryCost() ? 'disabled' : ''} style="width:100%">
        🎒 持ち越し枠を1つ増やす（🪙${nextCarryCost()}）</button>` : ''}
      <div class="doc" style="font-size:11px;margin-top:6px;color:var(--dim)">
        累積アイテムのカウンターはステージが変わるとリセットされます。<br>
        増やした持ち越し枠はこの先ずっと使えます。
      </div>
      <div class="row" style="margin-top:12px"><button class="btn primary" data-act="c">${thenNext ? '次の農園へ' : '決定'}</button></div>
    `, el => {
      el.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
        const it = S.items[+b.dataset.pick];
        const at = S.carryOver.indexOf(it);
        if(at >= 0) S.carryOver.splice(at, 1);
        else if(S.carryOver.length < carryLimit()) S.carryOver.push(it);
        else toast(`持ち越せるのは ${carryLimit()} 個までです`);
        drawCarry(thenNext);
      });
      const buy = el.querySelector('[data-act="buy"]');
      if(buy) buy.onclick = () => {
        const cost = nextCarryCost();
        if(cost === null || S.coins < cost) return;
        S.coins -= cost;
        S.carrySlots++;
        hud();
        toast(`持ち越し枠が ${carryLimit()} に増えた`);
        drawCarry(thenNext);
      };
      el.querySelector('[data-act="c"]').onclick = () => thenNext ? nextStage(true) : draw();
    }, () => thenNext ? nextStage(true) : draw());
  };

  // ---- 枠が満杯・かつ新規（重複ではない）たからものを見つけたときの処理 ----
  // 強化は「偶然同じたからものが出たとき」だけに限定したので、ここでは
  // 入れ替えるか、置いていくかの二択になる。
  const handle = (t, mode) => {
    if(mode === 'swap'){
      sheet(`
        <h2>${t.ic} ${t.n}</h2>
        <div class="sub">手放すたからものを選ぶ</div>
        ${S.treasures.map((o,i) => `<button class="card tre" data-pick="${i}">
            <span class="ic">${o.ic}</span>
            <span style="flex:1"><span class="t">${o.n}
              ${LV(o) > 1 ? `<span class="tag">Lv${LV(o)}</span>` : ''}</span>
              <div class="d">${descOf(o)}</div></span>
          </button>`).join('')}
        <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="back">戻る</button></div>
      `, el => {
        el.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => {
          S.treasures[+b.dataset.pick] = {...t, level:1};
          hud();
          afterTreasure();          // 続けて「持ち越すアイテム」の選択へ
        });
        el.querySelector('[data-act="back"]').onclick = () => handle(t);
      }, () => handle(t));
      return;
    }

    sheet(`
      <h2>${t.ic} ${t.n}</h2>
      <div class="sub">${t.d}<br>たからもの枠が満杯です。どうしますか。</div>
      <button class="card tre" data-act="swap">
        <span class="ic">🔄</span>
        <span style="flex:1"><span class="t">入れ替える</span>
          <div class="d">持っているたからものを1つ手放して、これを Lv1 で持ち帰る</div></span>
      </button>
      <button class="card" data-act="drop">
        <span class="ic">🗑️</span>
        <span style="flex:1"><span class="t">置いていく</span>
          <div class="d">何も変えずに次の農園へ</div></span>
      </button>
      <div class="doc" style="font-size:11px;margin-top:6px;color:var(--dim)">
        強化は、偶然同じたからものが再び出たときだけできる。
      </div>
      <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="back">選び直す</button></div>
    `, el => {
      el.querySelector('[data-act="swap"]').onclick  = () => handle(t, 'swap');
      el.querySelector('[data-act="drop"]').onclick  = nextStage;
      el.querySelector('[data-act="back"]').onclick  = draw;
    }, draw);
  };

  draw();
}

function stageFail(){
  S.busy = true;
  // 失敗しても、持っていた種は半分がコインとして戻る（丸損にはしない）
  const refund = Math.floor(S.seeds * CONFIG.failRefund);
  if(refund > 0){ S.coins += refund; }
  S.seeds = 0;
  hud();
  sheet(`
    <h2>ターン切れ</h2>
    <div class="sub">${stageData(S.stage).name}</div>
    <div class="doc">
      収穫 <b>${fmtScore(S.harvest)}</b> / ${fmtScore(S.target)}。<br>
      目標に届かなかった。たからものは手元に残る。
      ${refund > 0 ? `<br>残っていた種の半分が <b style="color:var(--lantern)">🪙${refund} コイン</b> になった（所持 🪙${S.coins}）` : ''}
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn primary" data-act="retry">このステージをやり直す</button>
    </div>
    <div class="row"><button class="btn ghost" data-act="reset">最初から</button></div>
  `, el => {
    el.querySelector('[data-act="retry"]').onclick = () => { closeSheet(); startStage(); };
    el.querySelector('[data-act="reset"]').onclick = () => { closeSheet(); newGame(); };
  });
}

function newGame(){
  S.stage = 0; S.slots = CONFIG.startSlots; S.treasures = []; S.uid = 0;
  S.lifetime = 0; S.maxStage = 0; S.carrySlots = 0; S.fruitMark = {};

/* ============================================================================

   直線に丸を並べただけの簡易表示。クリア済みは金、いま挑めるのは光る枠、
   未開拓は暗い丸。押すと選択でき、開拓済みの農園にはいつでも戻れる。
   ========================================================================= */
function openMap(back){
  if(typeof back !== 'function') back = null;
  const done = () => back ? back() : closeSheet();
  let sel = S.stage;
  const last = Math.max(STAGES.length, S.maxStage + 2);

  const draw = () => {
    let track = '';
    for(let i=0;i<last;i++){
      const st = stageData(i);
      const cleared = i < S.maxStage;
      const now = i === S.maxStage;
      const lock = i > S.maxStage;
      if(i > 0) track += `<div class="mapline ${i <= S.maxStage ? 'done' : ''}"></div>`;
      track += `<button class="mapnode ${cleared?'done':''} ${now?'now':''} ${lock?'lock':''}" data-go="${i}">
        <span class="mapdot ${cleared?'done':''} ${now?'now':''} ${i===sel?'sel':''}">${cleared ? '✓' : i+1}</span>
        <span class="mapname">${lock ? '？？？' : st.name}</span>
      </button>`;
    }

    const st = stageData(sel);
    const lock = sel > S.maxStage;
    sheet(`
      <h2>農園マップ</h2>
      <div class="sub">開拓した農園はいつでも選び直せます</div>
      <div class="map" id="mapScroll"><div class="maptrack">${track}</div></div>

      <div class="mapinfo">
        <div class="t">${lock ? '？？？' : `${sel+1}. ${st.name}`}</div>
        <div class="d">${lock ? 'まだ開拓されていない'
          : `${st.w}×${st.h} ／ ${st.turns}ターン ／ 目標 ${fmtScore(st.target)} ／ フルーツ${st.fruits}種`}</div>
      </div>
      <div class="row" style="margin-top:10px">
        <button class="btn primary" data-act="go" ${lock ? 'disabled' : ''}>
          ${sel < S.maxStage ? 'この農園を最初からやり直す' : 'この農園へ向かう'}</button>
      </div>
      <div class="doc" style="font-size:11px;margin-top:8px;color:var(--dim)">
        農園を移ると、持っているアイテムは畑に還ります。たからものと地力は引き継がれます。<br>
        地力 Lv${soilLevel()} ／ 累計収穫 ${fmtScore(S.lifetime)}
      </div>

      <h3 class="sec">道具屋</h3>
      <div class="seedbar">
        <span class="lbl">🪙 コイン</span>
        <span class="num">×${S.coins}</span>
        <span class="cost">💣 爆弾 ×${S.bombs}</span>
      </div>
      <button class="btn" data-act="buybomb" style="width:100%"
        ${S.coins < CONFIG.bombPrice ? 'disabled' : ''}>
        💣 爆弾を1つ買う（🪙${CONFIG.bombPrice}）</button>
      <div class="doc" style="font-size:11px;margin-top:6px;color:var(--dim)">
        余った不思議な種は、農園を出るときにコインへ変わります。
        爆弾はいつでも盤面で使えます（ターンを1消費）。
      </div>
      ${back ? '<div class="row" style="margin-top:12px"><button class="btn ghost" data-act="c">戻る</button></div>' : ''}
    `, el => {
      el.querySelectorAll('[data-go]').forEach(b => b.onclick = () => {
        const i = +b.dataset.go;
        if(i > S.maxStage){ toast('まだ開拓されていない'); return; }
        sel = i; draw();
      });
      el.querySelector('[data-act="go"]').onclick = () => {
        if(sel > S.maxStage) return;
        S.stage = sel;
        closeSheet();
        startStage();
      };
      const bb = el.querySelector('[data-act="buybomb"]');
      if(bb) bb.onclick = () => {
        if(S.coins < CONFIG.bombPrice) return;
        S.coins -= CONFIG.bombPrice;
        S.bombs++;
        autoSave(); hud(); draw();
      };
      const cb = el.querySelector('[data-act="c"]');
      if(cb) cb.onclick = done;

      // 現在地が見えるところまでスクロールしておく
      const sc = document.getElementById('mapScroll');
      if(sc) sc.scrollLeft = Math.max(0, sel * 90 - 120);
    }, back ? done : null);   // クリア後は農園を選ぶまで閉じられない
  };
  draw();
}

function saveText(){

    v:VERSION,
    stage:S.stage, maxStage:S.maxStage, slots:S.slots, seeds:S.seeds,
    lifetime:S.lifetime, spd:S.spd, carriedMult:S.carriedMult, carrySlots:S.carrySlots,
    fruitMark:S.fruitMark, coins:S.coins, bombs:S.bombs, storeRerolls:S.storeRerolls,
    rerollBase:S.rerollBase, rerollStage:S.rerollStage,
    items:S.items.map(i => [i.id, LV(i)]),
    treasures:S.treasures.map(t => [t.id, LV(t)])
  });

/* ---------------- ブラウザへの自動保存 ----------------
   既存の saveText / loadText をそのまま使い、localStorage に置くだけ。
   保存はステージをクリアした時だけ行う（毎ターン書くと負荷が高く、
   途中で閉じても失うのは1ステージ分で済む）。
   プライベートモードなどで localStorage が使えない環境でも
   ゲーム自体は動き続けるよう、すべて try/catch で囲う。 */
const SAVE_KEY = 'fruitopia-save';

function autoSave(){
  try{
    localStorage.setItem(SAVE_KEY, saveText());
    return true;
  }catch(e){ return false; }        // 保存できなくてもプレイは続行できる
}
function hasAutoSave(){
  try{ return !!localStorage.getItem(SAVE_KEY); }catch(e){ return false; }
}
function autoLoad(){
  try{
    const txt = localStorage.getItem(SAVE_KEY);
    if(!txt) return {ok:false, msg:'保存データがありません'};
    return loadText(txt);
  }catch(e){ return {ok:false, msg:'保存データを読み取れませんでした'}; }
}
function clearAutoSave(){
  try{ localStorage.removeItem(SAVE_KEY); return true; }catch(e){ return false; }
}

function loadText(txt){
  let o;
  try{ o = JSON.parse(txt.trim()); }
  catch(e){ return {ok:false, msg:'テキストを読み取れませんでした'}; }
  if(!o || typeof o !== 'object' || !Array.isArray(o.items)) return {ok:false, msg:'セーブデータの形式が違います'};

  const warn = [];
  if(o.v !== VERSION) warn.push(`v${o.v} のデータを v${VERSION} で読み込みました`);

  S.stage    = Math.max(0, o.stage | 0);
  S.maxStage = Math.max(S.stage, o.maxStage | 0);
  S.slots    = Math.min(CONFIG.maxSlots, Math.max(1, o.slots | 0 || CONFIG.startSlots));
  S.lifetime = bnCompare(toBN(o.lifetime || 0), 0) > 0 ? toBN(o.lifetime || 0) : bn(0);
  S.carriedMult = Math.max(1, +o.carriedMult || 1);
  S.carrySlots = Math.min(CONFIG.carrySlotCosts.length, Math.max(0, o.carrySlots | 0));
  S.fruitMark = (o.fruitMark && typeof o.fruitMark === 'object') ? o.fruitMark : {};
  S.coins = Math.max(0, o.coins | 0);
  S.bombs = Math.max(0, o.bombs | 0);
  S.storeRerolls = Math.max(0, o.storeRerolls | 0);
  S.rerollBase = Math.max(0, o.rerollBase | 0);
  S.rerollStage = (o.rerollStage === undefined) ? -1 : (o.rerollStage | 0);
  S.carryOver = [];
  if(o.spd) { S.spd = +o.spd; applySpeed(); }

  const lost = [];
  S.treasures = (o.treasures || []).map(([id, l]) => {
    const t = TREASURES.find(x => x.id === id);
    if(!t){ lost.push(id); return null; }
    return {...t, level:Math.min(CONFIG.treasureMaxLv, Math.max(1, l | 0))};
  }).filter(Boolean).slice(0, CONFIG.treasureSlots);

  const items = o.items.map(([id, l]) => {
    const it = ITEMS.find(x => x.id === id);
    if(!it){ lost.push(id); return null; }
    return {...it, level:Math.min(CONFIG.itemMaxLv, Math.max(1, l | 0))};
  }).filter(Boolean);

  startStage();                       // 盤面と登場フルーツを組み直す
  S.items = items;                    // ステージ開始でリセットされるので後から戻す
  S.seeds = Math.max(0, o.seeds | 0);

  closeSheet();
  refreshSpawn();
  sync(false);
  hud();
  if(lost.length) warn.push(`${lost.length}件は現在のバージョンに存在せず読み飛ばしました`);
  return {ok:true, msg:warn.join(' ／ ') || '読み込みました'};
}

/* ---------------- 図鑑：全アイテム一覧 ---------------- */
const TAG_ORDER = ['スコア','倍率','負倍率','確率','出現率','果実','累積','シナジー','即発','特殊'];

/* ---------------- レベル別効果の一覧 ---------------- */
function openLevels(back){
  if(typeof back !== 'function') back = null;
  const done = () => back ? back() : closeSheet();

  // たからもの：dl(v) が各レベルの効果文を返すので、それをそのまま並べる
  const treRows = TREASURES.map(t => {
    if(t.noLevel){
      return `<tr><td class="ic">${t.ic}</td><td>${t.n}
        <div style="font-size:10.5px;color:var(--dim)">レベルの概念なし ／ ${t.d}</div></td>
        <td style="color:var(--dim)">—</td></tr>`;
    }
    const steps = [];
    for(let v = 1; v <= CONFIG.treasureMaxLv; v++) steps.push(`Lv${v} ${t.dl(v)}`);
    const mine = S.treasures.find(x => x.id === t.id);
    return `<tr${mine ? ' style="background:#FFF3DE"' : ''}>
      <td class="ic">${t.ic}</td>
      <td>${t.n}${mine ? `<span class="tag">所持 Lv${LV(mine)}</span>` : ''}
        <div style="font-size:10.5px;color:var(--dim);line-height:1.6">${steps.join('<br>')}</div></td>
      <td></td></tr>`;
  }).join('');

  // アイテム：重ねると「効果がレベル倍になる」のが基本。例外だけ個別に注記する。
  const EXCEPT = {
    pray:'レベルごとに +1倍（指数的には増えない）',
    detonator:'レベルごとに +1.5倍（指数的には増えない）',
    newmoon:'レベルごとに +2倍（指数的には増えない）',
    map:'レベルの概念なし'
  };
  const itemRows = TAG_ORDER.map(tag => {
    const list = ITEMS.filter(i => i.tag === tag && !i.once);
    if(!list.length) return '';
    return `<tr class="mute"><td colspan="3" style="padding-top:10px">
        <b style="letter-spacing:.14em">${tag}</b></td></tr>` +
      list.map(it => {
        const mine = S.items.find(x => x.id === it.id);
        const note = it.id.startsWith('fake_')
          ? 'レベルごとに +1倍（指数的には増えない）'
          : (EXCEPT[it.id] || (it.track
              ? `同じ累積量でも効果がレベル倍になる（${it.every}${it.unit || ''}ごと）`
              : '効果量がレベル倍になる'));
        return `<tr${mine ? ' style="background:#FFF3DE"' : ''}>
          <td class="ic">${it.ic}</td>
          <td>${it.n}${mine ? `<span class="tag">所持 Lv${LV(mine)}</span>` : ''}
            <div style="font-size:10.5px;color:var(--dim)">${descOf(it)}</div></td>
          <td style="font-size:10px;color:var(--lantern);max-width:96px;white-space:normal">${note}</td>
        </tr>`;
      }).join('');
  }).join('');

  const onceRows = ITEMS.filter(i => i.once).map(it =>
    `<tr><td class="ic">${it.ic}</td><td>${it.n}
      <div style="font-size:10.5px;color:var(--dim)">${descOf(it)}</div></td>
      <td style="font-size:10px;color:var(--dim)">1回限り<br>枠を使わない</td></tr>`).join('');

  sheet(`
    <h2>レベル別の効果</h2>
    <div class="sub">同じものをもう一度手に入れると重なって強くなります。
      アイテムは最大 Lv${CONFIG.itemMaxLv}、たからものは最大 Lv${CONFIG.treasureMaxLv}。
      いま持っているものは色付きの行で表示されます。</div>

    <h3 class="sec">たからもの（永続）</h3>
    <table class="tbl">${treRows}</table>

    <h3 class="sec">アイテム（そのステージ限り）</h3>
    <div class="doc" style="font-size:11px;margin-bottom:6px">
      基本は「効果量がレベル倍」。倍率系は掛け算で重なるので、
      ×2 のアイテムを Lv3 まで重ねると ×8 になります。
    </div>
    <table class="tbl">${itemRows}</table>

    <h3 class="sec">即発アイテム（コインと交換）</h3>
    <table class="tbl">${onceRows}</table>

    <div class="row" style="margin-top:16px">
      <button class="btn primary" data-act="c">${back ? '戻る' : '閉じる'}</button>
    </div>
  `, el => el.querySelector('[data-act="c"]').onclick = done, done);
}

function openCatalog(back){
  if(typeof back !== 'function') back = null;
  const done = () => back ? back() : closeSheet();
  const owned = id => S.items.filter(x => x.id === id).length;
  const held  = id => S.treasures.some(x => x.id === id);

  const card = (x, kind) => {
    const mine = kind === 'tre' ? S.treasures.find(t => t.id === x.id) : null;
    const n = kind === 'item' ? owned(x.id) : (mine ? 1 : 0);
    const cls = [kind === 'tre' ? 'tre' : (x.neg ? 'neg' : ''), n ? 'on' : ''].filter(Boolean).join(' ');
    const gate = x.need ? `<span class="tag">${F[x.need].name}が出るステージのみ</span>` : '';
    const uniq = x.unique ? `<span class="tag">1個まで</span>` : '';
    const rare = kind === 'item' && isRare(x)
      ? (r => `<span class="tag" style="border-color:${r.col};color:${r.col};font-weight:800">${r.mark}</span>`)(RARITY[rarityOf(x)]) : '';
    return `<div class="card ${cls}">
      <span class="ic">${x.ic}</span>
      <span style="flex:1"><span class="t">${x.n}${rare}${gate}${uniq}
        ${mine && LV(mine) > 1 ? `<span class="tag">Lv${LV(mine)}</span>` : ''}</span>
        <div class="d">${mine ? descOf(mine) : x.d}</div></span>
      <span class="chk">${n > 1 ? '×' + n : '✓'}</span>
    </div>`;
  };

  const byTag = TAG_ORDER.map(tag => {
    const list = ITEMS.filter(i => i.tag === tag);
    if(!list.length) return '';
    return `<h3 class="sec">${tag}（${list.length}）</h3>` + list.map(i => card(i, 'item')).join('');
  }).join('');

  const misc = ITEMS.filter(i => !TAG_ORDER.includes(i.tag));
  const fruitRows = FRUITS.map(f => `<div class="card" style="border-color:${f.color}44">
      <span class="ic">${fruitIconHTML(f.id, '30px')}</span>
      <span style="flex:1"><span class="t">${f.name}<span class="tag">基礎 ${f.base}</span></span>
        <div class="d">${f.fx}：${f.fxDesc}</div></span>
    </div>`).join('');

  sheet(`
    <h2>図鑑</h2>
    <div class="sub">アイテム ${ITEMS.length} 種（${RARITY.rare.mark}レア ${ITEMS.filter(i=>rarityOf(i)==='rare').length} 種／${RARITY.epic.mark}ハイレア ${ITEMS.filter(isEpic).length} 種）
      ／ たからもの ${TREASURES.length} 種 ／ フルーツ ${FRUITS.length} 種<br>
      所持中のものは金色の枠と ✓ が付きます。
      ${RARITY.rare.mark}レアは腐りにくい汎用強化、${RARITY.epic.mark}ハイレアはビルドの主軸になる強力なものです。</div>

    ${byTag}
    ${misc.length ? `<h3 class="sec">その他</h3>` + misc.map(i => card(i,'item')).join('') : ''}

    <h3 class="sec">たからもの（永続・${CONFIG.treasureSlots}枠・最大Lv${CONFIG.treasureMaxLv}）</h3>
    ${TREASURES.map(t => card(t, 'tre')).join('')}

    <h3 class="sec">フルーツと固有効果</h3>
    ${fruitRows}

    <div class="row" style="margin-top:16px">
      <button class="btn" data-act="lv">📊 レベル別の効果</button>
      <button class="btn primary" data-act="c">${back ? '戻る' : '閉じる'}</button>
    </div>
  `, el => {
    el.querySelector('[data-act="c"]').onclick = done;
    el.querySelector('[data-act="lv"]').onclick = () => openLevels(() => openCatalog(back));
  }, done);
}

/* ---------------- 倍率の内訳 ---------------- */
function openBreakdown(back){
  if(typeof back !== 'function') back = null;   // クリックイベントが渡ってきても無視する
  if(S.busy && !back) return;
  const c = ctx();
  const m = staticMult(c);
  const pct = v => Math.round(v*1000)/10 + '%';
  const sgn = v => (v >= 0 ? '+' : '') + v;

  // 1個あたりの基礎スコア・固有効果率・出現率
  const rates = spawnRates();
  const evenRate = 1 / S.fruitIds.length;
  const fruitRows = S.fruitIds.map(id => {
    const f = F[id];
    const score = Math.round(cellValue({f:id}, c) * 10) / 10;
    const ch = Math.min(1, CONFIG.effectChance + c.chanceAdd + (c.fruitChance[id] || 0));
    const rt = rates[id] || 0;
    const fm = c.fruitMul[id] || 1;
    const skew = rt > evenRate * 1.08 ? 'var(--lantern)' : rt < evenRate * 0.92 ? 'var(--bad)' : 'var(--dim)';
    return `<tr>
      <td class="ic">${fruitIconHTML(id, '19px')}</td>
      <td>${f.name}<br><span style="font-size:10px;color:var(--dim)">${f.fx}：${f.fxDesc}</span></td>
      <td>${score}
        <br><span style="font-size:10px;color:${ch > CONFIG.effectChance ? 'var(--lantern)' : 'var(--dim)'};font-weight:400">効果 ${pct(ch)}</span>
        <br><span style="font-size:10px;color:${skew};font-weight:400">出現 ${pct(rt)}</span>
        ${fm !== 1 ? `<br><span style="font-size:10px;color:var(--lantern);font-weight:400">累積 ${fmtMult(fm)}</span>` : ''}
      </td>
    </tr>`;
  }).join('');

  // まとめ消し（パターン）ボーナス
  const sb = CONFIG.sizeBonus + c.sizeAdd;
  const sizeRows = [3,4,5,6,7].map(n =>
    `<tr class="${n === 3 ? 'mute' : ''}"><td colspan="2">${n}個まとめて消し</td>
     <td>${n === 3 ? '±0' : '+' + (n-3)*sb}</td></tr>`).join('');

  // 連鎖倍率
  const growth = CONFIG.chainMode === 'geometric'
    ? CONFIG.chainGrowth + c.chainAdd : CONFIG.baseChain + c.chainAdd;
  const chainRows = [1,2,3,4,5,6,7,8].map(n => {
    const m = chainMultiplier(n, c);
    return `<tr class="${n === 1 ? 'mute' : ''}"><td colspan="2">${n} 連鎖目</td>
      <td style="${m >= 10 ? 'color:var(--lantern)' : ''}">${fmtMult(m)}</td></tr>`;
  }).join('');

  // スコア倍率の出どころ
  const multRows = c.multSrc.length
    ? c.multSrc.map(s => `<tr class="${bnCompare(s.v, 0) < 0 ? 'neg' : ''}">
        <td class="ic">${s.item.ic}</td><td>${s.item.n}</td><td>${fmtMult(s.v)}</td></tr>`).join('')
    : `<tr class="mute"><td colspan="3">倍率アイテムなし（×1）</td></tr>`;
  const inverted = c.invert;

  // ターン中に一時的に増える分
  const tmp = [];
  if(S.fruitIds.includes('grape')) tmp.push(['🍇','ぶどうの醸造が発動', '+' + (Math.round((0.2+c.grapeBonus)*100)/100)]);
  if(c.perProc) tmp.push(['🔥','固有効果が1回発動するごと', '+' + (Math.round(c.perProc*100)/100)]);
  if(c.chain3)  tmp.push(['⚙️','3連鎖以上に到達したターン', '+' + (Math.round(c.chain3*100)/100)]);

  sheet(`
    <h2>倍率の内訳</h2>
    <div class="sub">今のビルドで1ターンに起きること</div>

    <h3 class="sec">計算式</h3>
    <div class="doc" style="font-size:11.5px">
      （フルーツの基礎スコア合計 ＋ まとめ消しボーナス）× 連鎖倍率 × <b>スコア倍率</b>
    </div>

    <h3 class="sec">農園の地力（永続）</h3>
    <table class="tbl">
      <tr><td class="ic">🌍</td><td>地力 Lv${soilLevel()}<br>
        <span style="font-size:10px;color:var(--dim)">累計収穫 ${fmtScore(S.lifetime)}

        `<tr><td class="ic">${fruitIconHTML(id, '19px')}</td><td>${F[id].name}の固有スコア（🔗の積み上げ・永続）</td>

      ${c.multFruit ? `<tr><td class="ic">✨</td><td>実りの属性：消すと基本倍率 +${CONFIG.multFruitGain}</td>

      <tr><td class="ic">🌑</td><td>黒：まれに盤面へ湧く ／ 盤面のフルーツを全消去

  `, el => {
    el.querySelector('[data-act="c"]').onclick = () => back ? back() : closeSheet();

function sheet(html, bind, onClose){
  const el = $('sheet');
  el.scrollTop = 0;
  el.innerHTML = (onClose ? `<button class="sheetx" data-x aria-label="閉じる">✕</button>` : '') + html;
  $('modal').classList.add('on');
  if(onClose){
    const x = el.querySelector('[data-x]');
    if(x) x.onclick = onClose;
  }
  if(bind) bind(el);
}
function closeSheet(){ $('modal').classList.remove('on'); hud(); }

board.addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if(!t || S.busy) return;
  const id = +t.dataset.id;
  const idx = S.grid.findIndex(c => c && c.id === id);
  if(idx < 0) return;

  if(S.bombMode){ useBomb(idx); return; }

  if(S.sel === null){ S.sel = idx; sync(false); return; }
  if(S.sel === idx){ S.sel = null; sync(false); return; }
  const ax = S.sel%S.w, ay = (S.sel/S.w)|0, bx = idx%S.w, by = (idx/S.w)|0;
  if(Math.abs(ax-bx) + Math.abs(ay-by) === 1) trySwap(S.sel, idx);
  else { S.sel = idx; sync(false); }
});

// スワイプ操作
let touchStart = null;
board.addEventListener('touchstart', e => {
  const t = e.target.closest('.tile');
  if(!t || S.busy) return;
  touchStart = {x:e.touches[0].clientX, y:e.touches[0].clientY, id:+t.dataset.id};
}, {passive:true});
board.addEventListener('touchend', e => {
  if(!touchStart || S.busy) return;
  const dx = e.changedTouches[0].clientX - touchStart.x;
  const dy = e.changedTouches[0].clientY - touchStart.y;
  const th = tileSize() * 0.4;
  const st = touchStart; touchStart = null;
  if(Math.max(Math.abs(dx), Math.abs(dy)) < th) return;
  const idx = S.grid.findIndex(c => c && c.id === st.id);
  if(idx < 0) return;
  if(S.bombMode){ useBomb(idx); return; }
  const x = idx%S.w, y = (idx/S.w)|0;
  const [nx,ny] = Math.abs(dx) > Math.abs(dy)
    ? [x + (dx>0?1:-1), y] : [x, y + (dy>0?1:-1)];
  if(nx<0||ny<0||nx>=S.w||ny>=S.h) return;
  S.sel = null;
  trySwap(idx, ny*S.w+nx);
}, {passive:true});

            const idx = S.items.indexOf(it);
            if(idx >= 0){
              const gain = sellPriceOf(it);
              S.items.splice(idx, 1);
              S.coins += gain;
              S.discarded++;
              toast(`${it.n} を売って 🪙${gain} 得た`);
              // 堆肥箱：手放した時点の基礎スコアの5%を、以後ずっと上乗せする
              if(S.items.some(x => x.id === 'compost')){
                const base = FRUITS[0].base + ctx().baseAdd;
                S.compostBonus += Math.max(1, Math.round(base * 0.05 * 10) / 10);
                toast(`堆肥箱：基礎スコア +${S.compostBonus}`);
              }
            }
            hud();
            toast(`${it.n} を手放した`);
            closeSheet();
          };
          e2.querySelector('[data-act="no"]').onclick = draw;
        }, draw);
    }, closeSheet);
  draw();
});

$('btnHelp').onclick = () => {
  const fx = FRUITS.map(f => `<li>${fruitIconHTML(f.id, '17px')} ${f.name} — <b>${f.fx}</b>：${f.fxDesc}</li>`).join('');
  sheet(`
    <h2>フルートピア</h2>
    <div class="sub">Fruitopia ／ マッチ3 × ビルド構築</div>
    <div class="doc">
      <h3 class="sec">目的</h3>
      制限ターン以内に目標の収穫量に届かせる。1回の入れ替えが1ターン。連鎖はすべて1ターンに含まれる。
      <h3 class="sec">数字の読み方</h3>
      <ul>
        <li><b>倍率</b>（×2、×1.6）… 掛かるもの。重ねると掛け算になる</li>
        <li><b>上昇量</b>（+0.15）… 倍率に足されるもの</li>
        <li><b>率</b>（12%、+5%）… 確率や割合</li>
      </ul>
      <h3 class="sec">収穫量の計算</h3>
      （フルーツの基礎スコア + 4個消し以降のボーナス）× 連鎖倍率 × <b>スコア倍率</b><br>
      連鎖倍率は1連鎖進むごとに <b>${fmtMult(CONFIG.chainGrowth)}</b> ずつ掛かり、
      深い連鎖ほど跳ね上がる（5連鎖で約${fmtMult(Math.pow(CONFIG.chainGrowth,4))}、
      8連鎖で約${fmtMult(Math.pow(CONFIG.chainGrowth,7))}）。<br>
      スコア倍率は掛け算で重なる。負の倍率同士を掛けると正に戻る。
      <h3 class="sec">フルーツ固有効果（基本 ${Math.round(CONFIG.effectChance*100)}%）</h3>
      <ul>${fx}</ul>
      <h3 class="sec">連鎖のマーク 🔗</h3>
      1ターンのうちに ${CONFIG.markChainStart} 連鎖に達すると、盤面のフルーツに 🔗 が付く。
      付く数は2連鎖ぶんで1つずつ増え、最大${CONFIG.markMax}個まで（${[3,5,7].map(n=>n+'連鎖で'+markCount(n)+'個').join('、')}）。<br>
      🔗 を消すと、付いていたフルーツの<b>固有スコアが永続的に +${CONFIG.markScoreGain}</b> される。
      りんごに付いた 🔗 を消せば、りんごが以後ずっと少しだけ強くなる。<br>
      ステージをまたいでも消えず、遊ぶほど積み上がっていく数値。
      同じフルーツに何度も乗せれば、そのフルーツを主軸に育てられる。
      <h3 class="sec">フルーツに付く属性</h3>
      即発アイテムを持っているあいだ、通常のフルーツに小さな印が付いて出てくる。
      フルーツの種類は変わらないので、いつもどおり3つそろえて消せばよい。<br>
      ⏳ 時の属性 … 消すと制限ターン +${CONFIG.turnFruitGain}<br>
      ✨ 実りの属性 … 消すと<b>基本倍率</b> +${CONFIG.multFruitGain}（そのステージ中ずっと掛かる）
      <h3 class="sec">即発アイテム</h3>
      使い切りか、数ターンで効き目が切れるアイテム。枠の右上に残りターンが出る。
      使い切りのものは枠を消費せず、取った瞬間に効果だけ出て消える。
      <h3 class="sec">持ち越し</h3>
      ステージクリア時に、アイテムを最大 ${carryLimit()} 個まで次の農園へ連れていける。
      ${carryLimit()}個以下ならすべて自動で持ち越され、それを超える場合は
      レベルの高い${carryLimit()}個が既定で選ばれる（あとから選び直せる）。
      持ち越し枠は、その画面でコインを払うと増やせる
      （${CONFIG.carrySlotCosts.join(' → ')}コイン）。枠は次の農園にも引き継がれる。
      基本倍率はたからもの「継承の苗木」があれば一部を持ち越せる。
      <h3 class="sec">特殊フルーツ</h3>
      まとめて消した数に応じて、その塊の中心にフルーツが1つ残る。次に消したときに発動する。<br>
      <b>${CONFIG.silverThreshold}個</b> → <b>銀</b>：盤面をランダムに${CONFIG.silverEat}マス虫食い（${fmtMult(CONFIG.silverMult)}）。
      銀どうしが同時に起爆すると${CONFIG.silverPairEat}マス。<br>
      <b>${CONFIG.goldThreshold}個</b> → <b>黄金</b>：まわりを丸く大きく抉る（${fmtMult(CONFIG.goldMult)}）。
      黄金が2つ同時に起爆すると、中心の1つが<b>虹色</b>に変わって残る。<br>
      <b>${CONFIG.rainbowThreshold}個</b> → <b>虹色</b>：盤面のランダムな${CONFIG.rainbowConvert}マスを

      爆発に巻き込まれた特殊フルーツは、一拍おいて誘爆する。<br>

      ただし<b>自分の手でマッチさせたときしか反応しない</b>。
      爆弾・爆風・虫食い・虹色など、他のどの効果でも破壊されず、誘爆もしない。
      アイテム「導火線」を持つと、他の爆発でも起爆するようになる。<br>
      <b>金どうし・銀どうしは2個並ぶだけで消せる</b>（通常のフルーツは3個必要）。
      <h3 class="sec">にせもののフルーツ</h3>
      所持していると対象フルーツの出現率が2倍になり、
      <b>${CONFIG.fakeInterval}ターンごと</b>に盤面の${CONFIG.fakeCount}マスがそのフルーツに変わる。
      複数所持している場合、先に書き換えたマスは後のアイテムに上書きされない。
      <h3 class="sec">農園の地力</h3>
      ステージをまたいで累計収穫量が積み上がり、10倍になるごとに
      <b>基礎スコアが永続的に +${CONFIG.soilGain}</b> される。進むほど土台が強くなる。
      <h3 class="sec">アイテムを重ねる</h3>
      すでに持っているアイテムをストアで取ると、枠を消費せず <b>Lv が上がり</b>、
      効果がもう一段ぶん重なる（最大 Lv${CONFIG.itemMaxLv}）。倍率系は掛け算で重なるため複利になる。<br>
      ストアの候補数は ${CONFIG.storeGrowth} ステージごとに1つ増える。<br>
      アイテムが手に入るのは <b>全ターンの前半${Math.round(CONFIG.storePhase*100)}%まで</b>。
      それ以降は仕入れが止まり、組み上げたビルドで稼ぎ切る時間になる。
      ターンの目盛りは、金色がストアの来るターン、暗い緑が稼ぎ専念の後半。
      <h3 class="sec">累積アイテム</h3>

      累積はステージ中ずっと保持され、ステージが変わるとリセットされる。
      アイテム枠の右上に現在の累積値または Lv が出る。
      <h3 class="sec">不思議な種</h3>
      ラウンド開始時に <b>${CONFIG.roundSeeds}個</b> 配られ、フルーツを消すと
      ${Math.round(CONFIG.seedChance*100)}% で追加される。<br>
      種そのものには使い道がなく、<b>ラウンド終了時にコインへ変わる</b>
      （残った種1個＝${CONFIG.coinPerSeed}コイン）。稼いだ種をどれだけ残せるかが、次の農園の資金になる。

      <h3 class="sec">コイン 🪙</h3>
      種から変わったお金。ステージをまたいで貯まる。買えるものは次のとおり。<br>
      ・ストアを引き直す（${CONFIG.rerollCost}から。引き直すたびに+1され、この先ずっと持ち越される）<br>
      ・${RARITY.rare.mark}レア以上だけを引き直す（上記＋${CONFIG.rareRerollCost}）<br>
      ・<b>即発アイテムと交換する</b>（${CONFIG.instantItemCost}・枠を消費しない。ストア画面の🎫から）<br>
      ・<b>一斉収穫</b>（${CONFIG.harvestBombCost}・ターンを1消費して、選んだフルーツを盤面から全部収穫する）<br>
      ・<b>爆弾</b>（マップの道具屋で ${CONFIG.bombPrice}）／<b>持ち越し枠</b>（${CONFIG.carrySlotCosts.join(' → ')}）<br>
      ストアで「取らずに次へ」を選ぶと <b>+${CONFIG.skipSeedReward}コイン</b>。

      アイテムはそのステージ限り。ターン終了ごとに3択で1つ選ぶ。<br>
      たからものは永続で、${CONFIG.treasureSlots}つまで装備できる。
      <b>偶然同じたからものが再び出ると、自動で Lv が +1 される</b>（最大 Lv${CONFIG.treasureMaxLv}、
      枠が満杯かどうかに関係なく強化される）。<br>
      枠が満杯のときに違うたからものを見つけたら、<b>入れ替える</b>か<b>置いていく</b>かの二択になる。
    </div>
    <div class="row" style="margin-top:14px">
      <button class="btn" data-act="list">📖 図鑑を見る</button>

    el.querySelector('[data-act="c"]').onclick = closeSheet;

// iPhone用オンスクリーンエラーログ（タイトル長押しで表示）

  const box = $('log');
  if(box){ box.style.display = 'block'; box.textContent += `${m} @${l}:${c}\n`; }
};

let rt;
window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(()=>{ layout(); sync(false); }, 120); });
document.addEventListener('gesturestart', e => e.preventDefault());

/* 保存データがあれば続きから始める。読めなければ新規で開始する。 */
if(hasAutoSave()){
  const r = autoLoad();
  if(r.ok) startStage(); else newGame();
} else {

}
